<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mis mensajes · María Juliana</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    [hidden] { display: none !important; }
    .wrap { width: min(100vw, 560px); margin: 0 auto; padding: 40px 20px 60px; }
    .login { min-height: 90svh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .count { text-align: center; color: #56607a; font-weight: 700; margin: 0 0 18px; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item { background: rgba(255,255,255,.85); border-radius: 20px; box-shadow: 0 8px 24px rgba(60,80,110,.1); overflow: hidden; }
    .item > button {
      all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
      display: flex; align-items: center; gap: 14px; padding: 16px 18px;
    }
    .avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
      background: var(--blue); color: #fff; font-weight: 700; font-size: 18px; }
    .who { flex: 1; min-width: 0; }
    .who b { display: block; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who small { color: #6a7390; font-weight: 600; }
    .chev { transition: transform .25s; color: var(--rose); font-size: 20px; }
    .item.open .chev { transform: rotate(90deg); }
    .item.read .avatar { background: #a9b6c8; }
    .answers { display: none; padding: 0 18px 18px; }
    .item.open .answers { display: block; animation: screenIn .35s ease both; }
    .answers h4 { margin: 14px 0 6px; color: var(--rose); font-size: 14px; }
    .answers p { margin: 0; white-space: pre-wrap; line-height: 1.5; font-weight: 500; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .empty { text-align: center; color: #6a7390; font-weight: 600; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="login" id="login">
      <p class="kicker">Solo para la cumpleañera</p>
      <h1 class="script">Mis mensajes</h1>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="Escribe la contraseña" required>
      </label>
      <p class="error" aria-live="polite"></p>
      <button class="btn" type="submit">Entrar</button>
      <a class="link" href="/" style="text-align:center;text-decoration:none">← Volver a la invitación</a>
    </form>

    <section id="board" hidden>
      <div class="top">
        <button class="link" id="refresh" type="button">↻ Actualizar</button>
        <a class="link" href="/" style="text-decoration:none">← Invitación</a>
      </div>
      <h1 class="script">Mis mensajes 💌</h1>
      <p class="count" id="count"></p>
      <div class="list" id="list"></div>
    </section>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const login = $('#login'), board = $('#board'), list = $('#list');
    const READ_KEY = 'juliana-leidos';
    const read = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
    const QUESTIONS = [
      ['admiras', '¿Qué es lo que más admiras de mí?'],
      ['palabras', '¿Qué palabras te gustaría regalarme en mi cumpleaños?'],
      ['recuerdo', 'Cuéntame un recuerdo lindo o feliz conmigo'],
    ];

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function render(items) {
      list.replaceChildren();
      $('#count').textContent = items.length === 1 ? '1 persona te escribió' : `${items.length} personas te escribieron`;
      if (!items.length) list.append(el('p', 'empty', 'Aún no hay mensajes. ¡Pronto llegarán! 💙'));
      for (const it of items) {
        const card = el('article', 'item' + (read.has(it.id) ? ' read' : ''));
        const head = el('button');
        head.type = 'button';
        head.append(el('span', 'avatar', (it.nombre || '?').trim().charAt(0).toUpperCase()));
        const who = el('span', 'who');
        who.append(el('b', '', it.nombre));
        who.append(el('small', '', new Date(it.fecha).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })));
        head.append(who, el('span', 'chev', '›'));
        const body = el('div', 'answers');
        for (const [k, q] of QUESTIONS) { body.append(el('h4', '', q), el('p', '', it[k])); }
        head.addEventListener('click', () => {
          card.classList.toggle('open');
          if (!read.has(it.id)) {
            read.add(it.id); card.classList.add('read');
            localStorage.setItem(READ_KEY, JSON.stringify([...read]));
          }
        });
        card.append(head, body);
        list.append(card);
      }
    }

    async function load(password) {
      const r = await fetch('/api/respuestas', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Error');
      sessionStorage.setItem('juliana-pass', password);
      login.hidden = true; board.hidden = false;
      render(j.items);
    }

    login.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = login.querySelector('.error');
      err.textContent = '';
      try { await load(login.elements.password.value); }
      catch (x) { err.textContent = x.message; }
    });
    $('#refresh').addEventListener('click', () => load(sessionStorage.getItem('juliana-pass')).catch(() => {}));
    const saved = sessionStorage.getItem('juliana-pass');
    if (saved) load(saved).catch(() => sessionStorage.removeItem('juliana-pass'));
  </script>
</body>
</html>
